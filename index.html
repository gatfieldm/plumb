<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Plumb</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&family=Atkinson+Hyperlegible+Mono:wght@400;600&display=swap">
<style>
/* Layout: one narrow play column (header, mode and difficulty bar, HUD, square board, readout), with stats and players in the same column. */
:root{
  --paper:#E9EEF2;
  --board:#F8FAFB;
  --surface:#FFFFFF;
  --grid:#E0E7EE;
  --grid-strong:#BFCAD6;
  --line:#CDD6E0;
  --ink:#14213D;
  --ink-2:#46546E;
  --ink-3:#7A879D;
  --pen:#D3306A;
  --pen-soft:#F6D7E2;
  --t1:#169A6B;
  --t2:#D9A915;
  --t3:#E0702A;
  --t4:#A9B4C2;
  --font-display:"Jost","Futura","Century Gothic","Avenir Next",sans-serif;
  --font-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"Atkinson Hyperlegible Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0C1220;--board:#111A2C;--surface:#152036;--grid:#1A253B;--grid-strong:#2A3854;--line:#24304A;
    --ink:#E6ECF6;--ink-2:#A3AFC4;--ink-3:#6C7A93;--pen:#FF5C93;--pen-soft:#3A1A2A;
    --t1:#2DC48B;--t2:#EEC23A;--t3:#F2873F;--t4:#3A4762;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0C1220;--board:#111A2C;--surface:#152036;--grid:#1A253B;--grid-strong:#2A3854;--line:#24304A;
  --ink:#E6ECF6;--ink-2:#A3AFC4;--ink-3:#6C7A93;--pen:#FF5C93;--pen-soft:#3A1A2A;
  --t1:#2DC48B;--t2:#EEC23A;--t3:#F2873F;--t4:#3A4762;color-scheme:dark;
}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pen);outline-offset:2px}

.app{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 28px;display:flex;flex-direction:column;gap:12px}

/* Header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--font-display);font-weight:600;font-size:28px;letter-spacing:-.015em;line-height:1;color:var(--ink)}
.brand svg{width:20px;height:24px;flex:none;transform:translateY(-1px)}
.who{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px 4px 4px;cursor:pointer;max-width:55%;min-width:0}
.who .nm{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font:700 13px var(--font-body)}
.av.lg{width:44px;height:44px;font-size:19px}

.bar2{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.seg{display:flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 11px;border-radius:5px;font-weight:600;font-size:14px;color:var(--ink-2);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.seg button[aria-selected="true"],.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.seg button:hover:not([aria-selected="true"]):not([aria-pressed="true"]){color:var(--ink)}
.seg.small button{padding:5px 9px;font-size:13px}

/* HUD */
.hud{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:28px;flex-wrap:wrap}
.hud-title{font-family:var(--font-display);font-weight:600;font-size:21px;line-height:1.1}
.hud-title small{font-family:var(--font-body);font-weight:400;font-size:13px;color:var(--ink-3);margin-left:8px}
.pips{display:flex;gap:5px}
.pip{width:22px;height:22px;border-radius:4px;border:1.5px solid var(--grid-strong)}
.pip.cur{border-color:var(--ink)}
.pip.t-g{background:var(--t1);border-color:var(--t1)}
.pip.t-y{background:var(--t2);border-color:var(--t2)}
.pip.t-o{background:var(--t3);border-color:var(--t3)}
.pip.t-m{background:var(--t4);border-color:var(--t4)}
.hud-stats{display:flex;align-items:center;gap:14px;font-family:var(--font-mono);font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.hud-stats b{color:var(--ink);font-weight:600}
.lives{display:flex;gap:4px}
.life{width:11px;height:11px;border-radius:50%;background:var(--pen)}
.life.lost{background:none;border:1.5px solid var(--grid-strong)}
.combo{color:var(--pen);font-weight:600}

/* Board */
.board{-webkit-touch-callout:none;position:relative;width:min(100%,56vh);width:min(100%,56svh);aspect-ratio:1;max-width:100%;margin-inline:auto;background:var(--board);border:1px solid var(--grid-strong);border-radius:3px;touch-action:none;cursor:crosshair;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.board canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.board.locked{cursor:pointer}
.board.idle{cursor:default}
.flash{position:absolute;left:50%;top:14px;transform:translateX(-50%);font-family:var(--font-display);font-weight:600;font-size:24px;color:var(--pen);background:var(--board);padding:2px 10px;border-radius:4px;pointer-events:none;opacity:0;transition:opacity .2s;white-space:nowrap}
.flash.on{opacity:1}

/* Readout */
.readout{min-height:132px;display:flex;flex-direction:column;gap:10px}
.kicker{font-size:13px;color:var(--ink-3)}
.prompt .big{margin:2px 0 0;font-size:20px;font-weight:600;text-wrap:balance}
.prompt .big b{font-family:var(--font-mono);color:var(--pen)}
.prompt .sub{margin:4px 0 0;color:var(--ink-2);font-size:14px}
.result{display:grid;grid-template-columns:1fr auto;align-items:end;gap:6px 14px}
.score{display:flex;align-items:baseline;gap:10px}
.score .num{font-family:var(--font-display);font-weight:600;font-size:50px;line-height:.95;color:var(--tier);font-variant-numeric:tabular-nums}
.score .tier{font-weight:700;font-size:16px;color:var(--tier)}
.meta{grid-column:1;color:var(--ink-2);font-size:14px}
.meta b{font-family:var(--font-mono);color:var(--ink)}
.result .btn{grid-column:2;grid-row:1 / span 2;align-self:center}
.t-g{--tier:var(--t1)}.t-y{--tier:var(--t2)}.t-o{--tier:var(--t3)}.t-m{--tier:var(--ink-3)}

.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:11px 16px;border-radius:6px;font-weight:600;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.btn.primary:hover{filter:brightness(1.15)}
.btn.small{padding:7px 11px;font-size:13px}
.btn.block{width:100%;justify-content:center;padding:14px 16px;font-size:16px}
.btn.danger{border-color:var(--pen);color:var(--pen)}
.btn:disabled{opacity:.45;cursor:not-allowed}
kbd{font:600 11px var(--font-mono);padding:1px 5px;border-radius:3px;border:1px solid currentColor;opacity:.6}

.summary{display:flex;flex-direction:column;gap:12px}
.sum-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.total{font-family:var(--font-display);font-weight:600;font-size:54px;line-height:.95;font-variant-numeric:tabular-nums}
.total small{font-size:24px;color:var(--ink-3);margin-left:2px}
.tiles{display:flex;gap:6px}
.tile{width:44px;height:44px;border-radius:5px;display:grid;place-items:center;font:600 14px var(--font-mono);color:#fff;background:var(--tier)}
.tile.t-m{background:var(--t4);color:var(--ink)}
.facts{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--ink-2);font-size:14px}
.facts b{font-family:var(--font-mono);color:var(--ink);font-weight:600}
.facts .new{color:var(--pen);font-weight:700}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.sharebox{margin:0;padding:10px 12px;border:1px dashed var(--grid-strong);border-radius:6px;font:13px/1.5 var(--font-mono);white-space:pre-wrap;word-break:break-all;user-select:all;-webkit-user-select:all}
.next{margin:0;color:var(--ink-3);font-size:13px}
.next span{font-family:var(--font-mono);color:var(--ink-2);font-variant-numeric:tabular-nums}

/* Forms */
.form{display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:5px}
.field label,.field .lbl{font-size:13px;font-weight:600;color:var(--ink-2)}
.input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-size:16px}
.input:focus{border-color:var(--ink-3);outline:none}
textarea.input{font:12px/1.4 var(--font-mono);min-height:84px;resize:vertical;word-break:break-all}
.hint{font-size:12px;color:var(--ink-3)}
.err{font-size:13px;color:var(--pen);min-height:1em}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;box-shadow:inset 0 0 0 2px var(--surface)}
.sw[aria-pressed="true"]{border-color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* Stats */
.stats{display:flex;flex-direction:column;gap:18px}
.acct{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);flex-wrap:wrap}
.acct-main{flex:1;min-width:0}
.acct-name{font-weight:700;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct-sub{font-size:13px;color:var(--ink-3)}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.kpi{background:var(--surface);padding:12px 12px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .v{font-family:var(--font-display);font-weight:600;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:16px;color:var(--ink-3)}
.kpi .l{font-size:12px;color:var(--ink-3)}
.panel{display:flex;flex-direction:column;gap:10px;min-width:0}
.panel h2{margin:0;font-family:var(--font-display);font-weight:600;font-size:19px;text-wrap:balance}
.panel h2 span{font-family:var(--font-body);font-weight:400;font-size:13px;color:var(--ink-3);margin-left:6px}
.phead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.tbl th{font:400 12px var(--font-body);color:var(--ink-3);text-align:right;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{text-align:right;padding:8px;border-bottom:1px solid var(--line);font-family:var(--font-mono);white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left;font-family:var(--font-body);font-weight:600;padding-left:0}
.bars{display:flex;flex-direction:column;gap:5px}
.bar{display:grid;grid-template-columns:76px 1fr 48px;align-items:center;gap:10px;font-size:13px}
.bar .lab{font-family:var(--font-mono);color:var(--ink-2);font-variant-numeric:tabular-nums}
.bar .track{height:18px;background:var(--grid);border-radius:3px;overflow:hidden}
.bar .fill{display:block;height:100%;background:var(--ink-3);border-radius:3px}
.bar.hot .fill{background:var(--pen)}
.bar .n{font-family:var(--font-mono);text-align:right;color:var(--ink-2);font-variant-numeric:tabular-nums}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;max-width:340px}
.cal .d{aspect-ratio:1;border-radius:3px;border:1px solid var(--grid-strong);max-width:100%}
.cal .d.t-g{background:var(--t1);border-color:var(--t1)}
.cal .d.t-y{background:var(--t2);border-color:var(--t2)}
.cal .d.t-o{background:var(--t3);border-color:var(--t3)}
.cal .d.t-m{background:var(--t4);border-color:var(--t4)}
.cal .d.today{outline:2px solid var(--ink);outline-offset:1px}
.cal-dow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;max-width:340px;font:10px var(--font-mono);color:var(--ink-3);text-align:center}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--ink-3)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.chart{width:100%;height:auto;display:block}
.runs{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.run{display:grid;grid-template-columns:62px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.run .when{font-family:var(--font-mono);font-size:12px;color:var(--ink-3)}
.run .what{min-width:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.run .sq{display:flex;gap:2px}
.run .sq i{width:10px;height:10px;border-radius:2px;background:var(--tier)}
.run .sq i.t-m{background:var(--t4)}
.run .pts{font-family:var(--font-mono);font-weight:600;font-variant-numeric:tabular-nums}
.dtag{font:400 12px var(--font-body);padding:1px 6px;border-radius:3px;border:1px solid var(--line);color:var(--ink-2)}
.lb{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.lb-row{display:grid;grid-template-columns:22px 28px 1fr auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.lb-row .av{width:24px;height:24px;font-size:11px}
.lb-row .rk{font-family:var(--font-mono);color:var(--ink-3);text-align:right}
.lb-row .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-row .sc{font-family:var(--font-mono);font-weight:600;font-variant-numeric:tabular-nums}
.lb-row.me .nm{font-weight:700}
.lb-row.me .rk{color:var(--pen)}
.plist{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.prow{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.prow .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.prow .nm small{font-weight:400;color:var(--ink-3);margin-left:6px}
.manage{display:flex;flex-direction:column;gap:16px;padding:14px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.manage h3{margin:0;font-size:14px;font-weight:700}
.empty{padding:16px;border:1px dashed var(--grid-strong);border-radius:8px;color:var(--ink-2);font-size:14px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:560px){.two{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.foot{color:var(--ink-3);font-size:12px;text-align:center;margin:0}

/* Header swap: brand on home/tabs, Home button inside a game */
.top{min-height:36px}
.top-r{display:flex;align-items:center;gap:8px;min-width:0}
.top-r .who{max-width:none}

button.brand{border:0;background:none;padding:0;cursor:pointer}
.back{display:inline-flex;align-items:center;gap:2px;border:0;background:none;padding:6px 10px 6px 0;font-weight:600;font-size:16px;color:var(--ink);cursor:pointer;border-radius:6px}
.back svg{width:20px;height:20px}
.play{display:flex;flex-direction:column;gap:12px}

/* Home */
.home{display:flex;flex-direction:column;gap:16px}
.greet{margin:-2px 0 0;color:var(--ink-2);font-size:15px}
.greet b{color:var(--ink)}
.toy{-webkit-touch-callout:none;position:relative;width:min(100%,40vh,360px);width:min(100%,40svh,360px);aspect-ratio:1;max-width:100%;margin-inline:auto;background:var(--board);border:1px solid var(--grid-strong);border-radius:3px;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.toy.dragging{cursor:grabbing}
.toy canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.toy-row{display:flex;justify-content:center;align-items:stretch;gap:10px;max-width:100%}
.toy-row .toy{margin-inline:0}
.toy-row.slider .toy{width:min(100% - 54px,40vh,360px);width:min(100% - 54px,40svh,360px)}
.wslider{width:44px;flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding-block:2px;cursor:ns-resize;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;border-radius:8px;transition:opacity .2s}
.wslider.off{opacity:.45;cursor:default}
.ws-val{font:600 13px var(--font-mono);color:var(--pen);font-variant-numeric:tabular-nums;min-height:18px}
.wslider.off .ws-val{color:var(--ink-3)}
.ws-track{position:relative;flex:1;width:8px;border-radius:4px;background:var(--grid);margin:12px 0}
.ws-fill{position:absolute;left:0;right:0;bottom:0;border-radius:4px;background:var(--pen)}
.ws-thumb{position:absolute;left:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--surface);border:2px solid var(--pen)}
.wslider.off .ws-fill{background:var(--grid-strong)}
.wslider.off .ws-thumb{border-color:var(--grid-strong)}
.wslider.hint .ws-thumb{animation:wsPulse 1.5s ease-in-out infinite}
@keyframes wsPulse{50%{box-shadow:0 0 0 8px var(--pen-soft)}}
.ws-cap{font-size:11px;color:var(--ink-3)}
.toy-note{margin:-6px 0 0;text-align:center;font-size:13px;color:var(--ink-2);min-height:19px;text-wrap:balance}
.toy-note b{font-family:var(--font-mono);color:var(--pen)}
.toy-mode{display:flex;align-items:center;justify-content:center;gap:8px;font-size:12px;color:var(--ink-3);margin-top:-6px}
.toy-hint{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);font-size:12px;color:var(--ink-2);background:var(--board);padding:1px 9px;border-radius:999px;border:1px solid var(--grid);pointer-events:none;transition:opacity .3s ease-in;white-space:nowrap}
.toy-hint.gone{opacity:0}
.home-main{display:flex;flex-direction:column;gap:14px}
.cta{display:flex;flex-direction:column;gap:6px}
.cta-sub{margin:0;text-align:center;font-size:13px;color:var(--ink-3)}
.dailies{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.dcard{display:flex;flex-direction:column;gap:7px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 10px 11px;cursor:pointer;min-width:0;transition:transform .12s ease-out,border-color .2s,box-shadow .2s}
.dcard:hover{border-color:var(--ink-3)}
.dcard:active{transform:scale(.97)}
.dcard.is-next{border-color:var(--pen);box-shadow:0 0 0 3px var(--pen-soft)}
.dc-name{font-family:var(--font-display);font-weight:600;font-size:17px;line-height:1.1}
.dc-mid{font-family:var(--font-display);font-weight:600;font-size:24px;line-height:1;font-variant-numeric:tabular-nums;color:var(--ink-2);white-space:nowrap}
.dc-mid small{font-size:13px;color:var(--ink-3);margin-left:1px}
.dcard.done .dc-mid{color:var(--tier)}
.dcard.done.t-m .dc-mid{color:var(--ink-2)}
.dc-foot{font-size:12px;color:var(--ink-3);min-height:14px;display:flex;align-items:center;gap:2px;flex-wrap:wrap}
.dcard.is-next .dc-foot{color:var(--pen);font-weight:700}
.dc-foot i{flex:none;display:block;width:9px;height:9px;border-radius:2px;background:var(--tier)}
.dc-foot i.t-m{background:var(--t4)}
.dc-foot i.empty{background:none;border:1.5px solid var(--grid-strong)}
.ecard{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:12px}
.ec-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.ec-title{font-family:var(--font-display);font-weight:600;font-size:19px}
.ec-best{margin:0;font-size:14px;color:var(--ink-2)}
.ec-best b{font-family:var(--font-mono);color:var(--ink)}
.alldone{align-items:center;text-align:center;gap:8px;padding:2px 0 4px}
.cd-big{font-family:var(--font-display);font-weight:600;font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.alldone .actions{justify-content:center}
.alldone .sharebox{text-align:left;align-self:stretch}
.vtitle{margin:0;font-family:var(--font-display);font-weight:600;font-size:26px;line-height:1.1}

/* Bottom tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tabs-in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 9px;font-size:12px;font-weight:600;color:var(--ink-3);cursor:pointer}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--ink)}
body.with-tabs .app{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}

/* Small feedback motion */
.btn{transition:transform .1s ease-out}
.btn:active:not(:disabled){transform:translateY(2px)}
.btn.wait{opacity:.5}
.shake{animation:shake .32s ease-in-out}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
.life.drain{animation:lifeDrain .55s ease-in}
@keyframes lifeDrain{0%{background:var(--pen);border:0;transform:none}15%{transform:translateX(-3px)}30%{transform:translateX(3px)}45%{transform:translateX(-2px);background:var(--pen)}100%{transform:none}}

@media (prefers-reduced-motion: reduce){.flash{transition:none}.dcard,.toy-hint,.btn{transition:none}.shake,.life.drain,.wslider.hint .ws-thumb{animation:none}.wslider{transition:none}}

<script>
(() => {

const LAUNCH = "2026-10-25";
const LS_INDEX = "centroids.players.v2";

const HALF_CREDIT = 0.08;         // an 8% miss earns 50

  easy:   { label: "Easy",   grid: true,  weighted: false, daily: [2, 2, 3, 3, 4], dots: r => r <= 4 ? 2 : r <= 9 ? 3 : r <= 15 ? 4 : 5, fadeFrom: 20 },

const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0;
// Looked up once; .matches stays current if the setting changes.
const rmMQ = window.matchMedia ? matchMedia("(prefers-reduced-motion: reduce)") : null;
let rmNow = !!(rmMQ && rmMQ.matches);

const reduceMotion = () => rmNow;
function ymd(d = new Date()) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }

const prettyCache = new Map();
function prettyDate(s) { if (prettyCache.has(s)) return prettyCache.get(s); const out = prettyDate0(s); prettyCache.set(s, out); return out; }

/* ---------- geometry + scoring ---------- */

// 100 only inside the bullseye; everything else tops out at 99.
function scoreFor(d) { return d < BULLSEYE ? 100 : Math.min(99, Math.round(100 * Math.pow(2, -Math.pow(d / HALF_CREDIT, 2)))); }
function tierOf(s) { return s >= 90 ? "g" : s >= 75 ? "y" : s >= 60 ? "o" : "m"; }
function tierLabel(s) { return s === 100 ? "Bullseye" : s >= 90 ? "Dead on" : s >= 75 ? "Close" : s >= 60 ? "Off" : "Miss"; }
const EMOJI = { g: "🟩", y: "🟨", o: "🟧", m: "⬛" };

/* ---------- storage (this device) ---------- */
const LS = {

/* ---------- player profiles ---------- */
const blankEndless = () => ({ best: 0, bestRound: 0, runs: 0 });
function blankProfile(name, color, diff) {

    settings: { difficulty: diff || "normal" },
    daily: { streak: 0, bestStreak: 0, lastDate: null, history: {} },
    endless: { easy: blankEndless(), normal: blankEndless(), hard: blankEndless() },

function normalizeProfile(p) {

    daily: { ...b.daily, ...(p.daily || {}), history: { ...((p.daily || {}).history || {}) } },
    endless: { ...b.endless }, totals: { ...b.totals, ...(p.totals || {}) },

}
function migrateV1(p) {
  const old = LS.get(LS_V1); if (!old || !old.daily) return;
  for (const [d, h] of Object.entries(old.daily.history || {})) p.daily.history[d] = { normal: { ...h, n: DIFFS.normal.daily } };
  Object.assign(p.daily, { streak: old.daily.streak || 0, bestStreak: old.daily.bestStreak || 0, lastDate: old.daily.lastDate || null });
  if (old.endless) p.endless.normal = { ...blankEndless(), best: old.endless.best || 0, bestRound: old.endless.bestRound || 0, runs: old.endless.runs || 0 };

  LS.set(LS_V1, null);
}
const Players = {
  index: LS.get(LS_INDEX) || { active: null, list: [] },
  saveIndex() { LS.set(LS_INDEX, this.index); },
  load(id) { return normalizeProfile(LS.get(LS_PLAYER(id))); },
  save(p) { p.updatedAt = Date.now(); LS.set(LS_PLAYER(p.id), p); this.upsertMeta(p); },
  upsertMeta(p) {

  nameTaken(name, exceptId) { const k = name.trim().toLowerCase(); return this.index.list.some(x => x.id !== exceptId && x.name.toLowerCase() === k); },
  remove(id) {
    this.index.list = this.index.list.filter(x => x.id !== id);
    if (this.index.active === id) this.index.active = this.index.list[0] ? this.index.list[0].id : null;
    LS.set(LS_PLAYER(id), null); for (const d of DIFF_KEYS) LS.set(LS_PROGRESS(id, d), null);

function validName(name, exceptId) {

  if (n.length < 2) return "Use at least 2 characters.";
  if (n.length > 16) return "Keep it to 16 characters or fewer.";

function encodeProfile(p) {

/* ---------- state ---------- */
const state = { view: "home", playDiff: null, popAt: 0, lbDiff: null, profile: null, games: {}, aim: null, down: false, finger: null, touch: !!(window.matchMedia && matchMedia("(pointer: coarse)").matches), statsDiff: "all", manage: false, notice: "" };
const defaultDiff = () => state.profile ? state.profile.settings.difficulty : "normal";
const diff = () => state.playDiff || defaultDiff();
const isGame = v => v === "daily" || v === "endless";
const gameKey = (view = state.view, d = diff()) => view + ":" + d;
const game = () => state.games[gameKey()];

function newDaily(d) {

}
function pushEndlessRound(g) {

function ensureGame() {

/* ---------- play flow ---------- */

  const inviting = !rm && (!toy.touched || (toy.droppedAt && toy.mode === "pinch" && toy.sel >= 0 && !toy.pinched));

function toyPoint(e) { const r = toyEl.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width, y: (e.clientY - r.top) / r.height }; }

  setTimeout(toySyncUI, 1850);
}
let noteCache = "";
function toySyncUI() {
  const sl = toy.mode === "slider", has = toy.sel >= 0, w = has ? toy.pts[toy.sel].m : 1;
  $("#toyRow").classList.toggle("slider", sl);
  const ws = $("#wslider"); ws.hidden = !sl; ws.classList.toggle("off", !has);
  ws.setAttribute("aria-disabled", String(!has)); ws.setAttribute("aria-valuenow", w.toFixed(1));
  $("#wsVal").textContent = has ? w.toFixed(1) : "–";
  const k = (w - 1) / (TOY_MAX_W - 1);
  $("#wsFill").style.height = (has ? k * 100 : 0) + "%"; $("#wsThumb").style.top = (has ? (1 - k) * 100 : 100) + "%";
  const how = sl ? "Use the slider or scroll over it to change it." : "Pinch anywhere to change it.";
  let note = "";
  if (performance.now() < toy.nudgeUntil) note = sl ? "Click a dot first to select it." : "Tap a dot first to select it.";
  else if (has) note = `Selected dot weighs <b>${w.toFixed(1)}</b>. ${how}`;
  else if (toy.touched) note = sl ? "Click a dot to select it, then use the slider to change its weight." : "Tap a dot to select it, then pinch anywhere to change its weight.";

}

// One finger: a short tap selects a dot (or clears the selection on empty space); moving more than 6 px drags it.
function toyDown(e) {
  const q = toyPoint(e), i = hitDot(q);
  toy.press = { i, x: e.clientX, y: e.clientY, moved: false, off: i >= 0 ? { x: toy.pts[i].ax - q.x, y: toy.pts[i].ay - q.y } : null };
}
function toyMoveTo(e) {
  const pr = toy.press; if (!pr) return;
  if (!pr.moved) {
    if (Math.hypot(e.clientX - pr.x, e.clientY - pr.y) < 6) return;
    pr.moved = true;
    if (pr.i >= 0) { toy.drag = pr.i; select(pr.i); markTouched(); toyEl.classList.add("dragging"); }
  }
  if (toy.drag >= 0) {
    const q = toyPoint(e), p = toy.pts[toy.drag];
    p.ax = clamp(q.x + pr.off.x, 0.06, 0.94); p.ay = clamp(q.y + pr.off.y, 0.1, 0.94); toyStart();

function toyRelease() {

toyEl.addEventListener("pointerdown", e => { if (e.pointerType === "touch") { setWeightMode("pinch"); return; } if (e.pointerType === "mouse") setWeightMode("slider"); try { toyEl.setPointerCapture(e.pointerId); } catch {} toyDown(e); });
toyEl.addEventListener("pointermove", e => { if (e.pointerType !== "touch") toyMoveTo(e); });
toyEl.addEventListener("pointerup", e => { if (e.pointerType !== "touch") toyRelease(); });
toyEl.addEventListener("pointercancel", e => { if (e.pointerType !== "touch") toyRelease(); });
toyEl.addEventListener("touchstart", e => {
  e.preventDefault();
  if (e.touches.length >= 2) { toy.press = null; toy.drag = -1; toyEl.classList.remove("dragging"); return; }   // the page-wide pinch handler takes over
  toyDown(e.changedTouches[0]);
}, { passive: false });
toyEl.addEventListener("touchmove", e => { e.preventDefault(); if (!toy.pinch && e.touches.length === 1) toyMoveTo(e.touches[0]); }, { passive: false });
toyEl.addEventListener("touchend", e => { e.preventDefault(); if (e.touches.length === 0 && !toy.pinch) toyRelease(); }, { passive: false });
toyEl.addEventListener("touchcancel", () => { toy.press = null; toyRelease(); });

// Pinch mode: with a dot selected, two fingers anywhere on the home screen change its weight.
// Nothing else reacts to the pinch, and without a selection nothing changes.
const fingerGap = (a, b) => Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
const homeEl = $("#home");
homeEl.addEventListener("touchstart", e => {
  if (state.view !== "home" || toy.mode !== "pinch" || e.touches.length < 2 || toy.pinch) return;
  if (toy.sel < 0) {
    const r = toyEl.getBoundingClientRect(), on = t => t.clientX >= r.left && t.clientX <= r.right && t.clientY >= r.top && t.clientY <= r.bottom;
    if (on(e.touches[0]) || on(e.touches[1])) { e.preventDefault(); nudge(); }
    return;
  }
  e.preventDefault();
  toy.pinch = { d0: Math.max(20, fingerGap(e.touches[0], e.touches[1])), w0: toy.pts[toy.sel].m };
  markTouched(); toyStart();
}, { passive: false });
homeEl.addEventListener("touchmove", e => {
  if (!toy.pinch) return;
  e.preventDefault();
  if (e.touches.length >= 2) setWeight(toy.pinch.w0 * fingerGap(e.touches[0], e.touches[1]) / toy.pinch.d0);
}, { passive: false });
const pinchEnd = e => { if (toy.pinch && e.touches.length < 2) { toy.pinch = null; toyStart(); } };
homeEl.addEventListener("touchend", pinchEnd); homeEl.addEventListener("touchcancel", pinchEnd);

// Slider mode: a vertical weight slider beside the board drives the selected dot.
const wsEl = $("#wslider");
function wsAt(e) { const r = $("#wsTrack").getBoundingClientRect(); setWeight(1 + clamp(1 - (e.clientY - r.top) / r.height) * (TOY_MAX_W - 1)); }
function wsDown(e) { if (toy.sel < 0) { nudge(); return false; } toy.sliding = true; wsAt(e); return true; }
const wsUp = () => { if (toy.sliding) { toy.sliding = false; toyStart(); } };
wsEl.addEventListener("pointerdown", e => { if (e.pointerType === "touch") return; if (wsDown(e)) try { wsEl.setPointerCapture(e.pointerId); } catch {} });
wsEl.addEventListener("pointermove", e => { if (e.pointerType !== "touch" && toy.sliding) wsAt(e); });
wsEl.addEventListener("pointerup", wsUp); wsEl.addEventListener("pointercancel", wsUp);
wsEl.addEventListener("touchstart", e => { e.preventDefault(); wsDown(e.changedTouches[0]); }, { passive: false });
wsEl.addEventListener("touchmove", e => { e.preventDefault(); if (toy.sliding) wsAt(e.touches[0]); }, { passive: false });
wsEl.addEventListener("touchend", e => { e.preventDefault(); wsUp(); }, { passive: false });
wsEl.addEventListener("touchcancel", wsUp);
wsEl.addEventListener("keydown", e => {
  if (toy.sel < 0) return;
  const w = toy.pts[toy.sel].m, step = { ArrowUp: 0.1, ArrowRight: 0.1, ArrowDown: -0.1, ArrowLeft: -0.1, PageUp: 1, PageDown: -1 }[e.key];
  if (step != null) { e.preventDefault(); setWeight(w + step); }
  else if (e.key === "Home") { e.preventDefault(); setWeight(1); } else if (e.key === "End") { e.preventDefault(); setWeight(TOY_MAX_W); }
});



// On a computer: trackpad pinch anywhere on the board, or the mouse wheel over the selected dot.
toyEl.addEventListener("wheel", e => {
  if (toy.sel < 0) return;
  const q = toyPoint(e), p = toy.pts[toy.sel];
  if (!e.ctrlKey && Math.hypot(p.x - q.x, p.y - q.y) > 0.1) return;   // ordinary scrolling elsewhere still scrolls the page
  e.preventDefault();
  setWeight(p.m * Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0025)));
}, { passive: false });
document.addEventListener("visibilitychange", () => { if (!document.hidden) toyStart(); });

/* ---------- leaderboard ---------- */
function renderLb() {
  const el = $("#lb"), d = state.lbDiff || defaultDiff(), many = Players.index.list.length > 1;
  el.innerHTML = `<div class="phead"><h1 class="vtitle">Leaderboard</h1><div class="seg small" id="lbDiff" role="group" aria-label="Difficulty">${DIFF_KEYS.map(k => `<button type="button" data-d="${k}" aria-pressed="${k === d}">${DIFFS[k].label}</button>`).join("")}</div></div>
    ${panelDevice(d)}
    <div class="empty">${many ? "These boards rank the players on this device." : "Right now this ranks players on this device, so it's just you."} Friend leaderboards come with accounts in the public version.${many ? "" : `<button class="btn small" id="lbAdd">Add a player</button>`}</div>`;
  el.querySelectorAll("#lbDiff button").forEach(b => b.addEventListener("click", () => { state.lbDiff = b.dataset.d; renderLb(); }));
  const add = $("#lbAdd"); if (add) add.addEventListener("click", () => { state.manage = "new"; go("stats"); });
  const p = state.profile;
  el.querySelectorAll(".lb-row[data-id]").forEach(r => { const m = Players.index.list.find(x => x.id === r.dataset.id); if (m) { r.querySelector(".nm").textContent = m.name + (m.id === p.id ? " (you)" : ""); r.querySelector(".av").textContent = m.name.trim()[0] || "?"; } });
}

/* ---------- views + transitions ---------- */
const SECTION = { home: "#home", daily: "#play", endless: "#play", stats: "#stats", lb: "#lb" };
function setView(v) {
  if (!SECTION[v] || (!state.profile && v !== "home" && v !== "stats")) v = "home";
  state.view = v;
  const inGame = isGame(v);
  if (!inGame) state.playDiff = null;
  for (const sel of new Set(Object.values(SECTION))) $(sel).hidden = SECTION[v] !== sel;
  $("#brand").hidden = inGame; $("#backBtn").hidden = !inGame;
  $("#tabs").hidden = inGame || !state.profile;
  document.body.classList.toggle("with-tabs", !$("#tabs").hidden);
  $("#foot").hidden = inGame;
  renderTabs(); renderFoot(); clearInterval(homeTimer);
  if (v === "stats") { renderStats(); return; }
  if (v === "lb") { renderLb(); return; }
  if (v === "home") { renderHome(); toyResize(); return; }
  const g = ensureGame();
  if (g && g.phase === "aim") g.rounds[g.idx].shownAt = performance.now();
  state.aim = null;
  resize(); kick(Math.max(700, g && g.rounds[g.idx].fade ? g.rounds[g.idx].fade + 500 : 0));

const EASE = "cubic-bezier(.2,.8,.2,1)";

}
function rise(els, delay = 90) {
  els.filter(Boolean).forEach((el, i) => el.animate([{ opacity: 0, transform: "translateY(10px)" }, { opacity: 1, transform: "none" }], { duration: 260, delay: delay + i * 45, easing: EASE, fill: "backwards" }));
}
function go(v) {
  const from = state.view, rm = reduceMotion() || !Element.prototype.animate;
  let rect = null;
  if (!rm && from === "home" && isGame(v)) rect = toyEl.getBoundingClientRect();
  if (!rm && isGame(from) && v === "home") rect = board.getBoundingClientRect();
  setView(v);
  window.scrollTo(0, 0);
  if (rm) return;
  if (isGame(v)) {
    if (rect) morph(board, rect);
    rise([$("#hud"), $("#readout")], rect ? 160 : 40);
  } else if (v === "home") {
    if (rect) morph(toyEl, rect, 380);
    rise([$("#greet"), ...$("#homeMain").children], rect ? 120 : 30);
  } else rise([...$(SECTION[v]).children].slice(0, 4), 20);
}
function renderFoot() {
  $("#foot").textContent = LS.ok ? "Players and progress are saved on this device. Daily boards reset at your local midnight." : "This browser is blocking storage, so progress won't be kept after you close the page.";
}

/* ---------- theme + resize ---------- */
readTokens();
new ResizeObserver(resize).observe(board);
new ResizeObserver(() => { if (state.view === "home") toyResize(); }).observe(toyEl);
new MutationObserver(() => { readTokens(); redraw(); }).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
if (window.matchMedia) { const mq = matchMedia("(prefers-color-scheme: dark)"); if (mq.addEventListener) mq.addEventListener("change", () => { readTokens(); redraw(); }); }

try { localStorage.removeItem("plumb.touchlog"); } catch {}   // setting left behind by the temporary touch log

/* ---------- boot ---------- */
function start(data) {
  const active = Players.index.active && Players.load(Players.index.active);
  if (active) activate(active);
  else if (Players.index.list.length) { const p = Players.load(Players.index.list[0].id); if (p) { Players.index.active = p.id; Players.saveIndex(); activate(p); } }
  if (data && data.games && state.profile && data.pid === state.profile.id) {
    for (const [k, g] of Object.entries(data.games)) { if (g && g.mode === "endless" && g.phase !== "done") { g.revealAt = 0; if (g.rounds[g.idx]) g.rounds[g.idx].shownAt = performance.now(); state.games[k] = g; } }
  }

}
const hot = window.claude && window.claude.hot;
try { if (hot && hot.snapshot) hot.snapshot(() => ({ view: state.view, pid: state.profile && state.profile.id, games: Object.fromEntries(Object.entries(state.games).filter(([k]) => k.startsWith("endless:"))) })); } catch {}

})();
</script>
